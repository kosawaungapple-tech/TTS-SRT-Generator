<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VBS: Professional Myanmar TTS &amp; Narration Engine</title>
    <meta name="description" content="A high-fidelity narration tool for Myanmar voiceovers using Gemini 2.5 Flash. Features cinematic voice quality and precise phonetic mapping." />
    <meta property="og:title" content="Remix Remix Remix SRTScript 30.09.2026 VBS: Professional Myanmar TTS &amp; Narration Engine" />
    <meta property="og:description" content="A high-fidelity narration tool for Myanmar voiceovers using Gemini 2.5 Flash. Features cinematic voice quality and precise phonetic mapping." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script>
      // Suppress Vite HMR WebSocket connection errors in AI Studio iframe environment
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        var src = (event.filename || '') + (event.error ? event.error.stack : '');
        if (msg.indexOf('WebSocket') !== -1 || src.indexOf('@vite/client') !== -1 || msg.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason ? (event.reason.message || event.reason.stack || String(event.reason)) : '';
        if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('@vite/client') !== -1 || reason.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"><div style="min-height:100vh;display:grid;place-items:center;background:#000"><div style="width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:#fbbf24;border-radius:50%;animation:vbsspin .8s linear infinite"></div></div></div>
    <script>try{var t=localStorage.getItem('VBS_THEME')||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';var e=document.documentElement;e.classList.add(t);e.style.colorScheme=t;if(t==='light')e.style.background='#f6f7fb'}catch(x){}</script>
    <style>html,body{background:#000;margin:0}html.light,html.light body{background:#f6f7fb}@keyframes vbsspin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
